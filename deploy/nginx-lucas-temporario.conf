# TEMPORÁRIO: só para o certbot conseguir emitir o certificado.
#
# O PROBLEMA QUE ESTE ARQUIVO RESOLVE: o `nginx-lucas.conf` de verdade aponta
# para um certificado que ainda não existe, então o nginx recusa carregar. E o
# certbot precisa do nginx atendendo no domínio para provar que ele é seu. Um
# espera o outro, e ninguém sai do lugar.
#
# Este arquivo quebra o impasse: atende só na porta 80, sem certificado nenhum, e
# serve exclusivamente o desafio do certbot. Emitido o certificado, ele é
# substituído pelo definitivo.
#
# POR QUE UM BLOCO SÓ PARA ESTE DOMÍNIO: sem ele, uma chamada a
# lucas.pjconsultoria.tech na porta 80 cai no primeiro bloco que o nginx
# encontra, que é o do CRM da Arcos, e o desafio do certbot vira 404 sem
# explicação nenhuma.

server {
    listen 80;
    server_name lucas.pjconsultoria.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Nada mais atende aqui ainda. Melhor um 404 honesto do que devolver a tela
    # do Lucas em texto claro antes de o certificado existir.
    location / {
        return 404;
    }
}
