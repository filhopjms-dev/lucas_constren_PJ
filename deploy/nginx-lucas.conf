# Serviço do Lucas: nginx.
#
# Vai para /etc/nginx/sites-available/lucas, com link em sites-enabled.
#
# POR QUE SUBDOMÍNIO E NÃO UM CAMINHO no domínio do CRM: a tela do Lucas busca
# /api/config, /api/testar e as outras a partir da RAIZ. Servida em
# crm.pjconsultoria.tech/lucas/, cada uma dessas chamadas iria bater na API do
# CRM da Arcos, que atende na mesma raiz. Não é hipótese: são dois aplicativos
# diferentes com o mesmo /api. Subdomínio separa os dois sem gambiarra.
#
# ⚠️ O SERVIÇO ESCUTA SÓ EM 127.0.0.1, e é isso que o mantém fora do alcance de
# todo mundo: o VPS está com ZERO regra de firewall (conferido em 29/09/2026).
# Quem atende de fora é este nginx, e só nas duas portas abaixo.

server {
    listen 80;
    server_name lucas.pjconsultoria.tech;

    # O certbot precisa desta porta aberta para emitir e renovar o certificado.
    # Depois de emitido, todo o resto sobe para HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name lucas.pjconsultoria.tech;

    ssl_certificate /etc/letsencrypt/live/lucas.pjconsultoria.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lucas.pjconsultoria.tech/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/lucas.log;

    # O CARTEIRO. O Trilho chama aqui, e o prazo é mais folgado que o resto
    # porque uma rodada pode levar 25 s pensando, com voltas de ferramenta no
    # meio. Prazo curto aqui cortaria a resposta no melhor momento, e o Trilho
    # leria isso como cérebro fora do ar.
    location /api/pensar {
        proxy_pass http://127.0.0.1:4310;
        proxy_read_timeout 60;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_read_timeout 60;
        client_max_body_size 8m;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
    }
}
