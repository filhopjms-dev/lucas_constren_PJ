  <rect x="8.5" y="29" width="4.5" height="11" rx="2.25" fill="#5fc3a0"/>
  <rect x="51" y="29" width="4.5" height="11" rx="2.25" fill="#5fc3a0"/>
  <rect x="14" y="20" width="36" height="29" rx="9.5" fill="#ffffff"/>
  <circle cx="24" cy="32.5" r="4.4" fill="#083d2e"/>
  <circle cx="40" cy="32.5" r="4.4" fill="#083d2e"/>
