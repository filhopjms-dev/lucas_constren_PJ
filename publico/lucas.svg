<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Lucas">
  <!-- O ícone do Lucas: um cérebro, que é o nome do servidor onde ele pensa.
       Desenhado para ler a 16 pixels, que é o tamanho em que ele vive na aba
       do navegador: poucas formas, muito contraste, nada de detalhe fino.
       Os dois hemisférios são caminhos separados, então a fissura do meio é
       uma fresta de verdade e não uma linha desenhada: linha fina some ao
       encolher, fresta não. Verde da casa no fundo, massa clara, sulcos
       apagados para não virarem sujeira no tamanho pequeno.
       Cuidado ao mexer neste texto: dois hifens seguidos quebram o comentário
       e o arquivo inteiro deixa de carregar como imagem, calado. -->
  <rect width="64" height="64" rx="14" fill="#083d2e"/>
  <g fill="#ffffff">
    <path d="M31 12 C25 8, 17 10, 16.5 16.5 C10.5 16.5, 7.5 22, 10.5 26.5
             C6.5 30.5, 7.5 36.5, 12 38.5 C11 44.5, 16 48.5, 22 46.5
             C24.5 49, 28 49, 31 47 Z"/>
    <path d="M33 12 C39 8, 47 10, 47.5 16.5 C53.5 16.5, 56.5 22, 53.5 26.5
             C57.5 30.5, 56.5 36.5, 52 38.5 C53 44.5, 48 48.5, 42 46.5
             C39.5 49, 36 49, 33 47 Z"/>
  </g>
  <g fill="none" stroke="#083d2e" stroke-width="2.6" stroke-linecap="round" opacity="0.55">
    <path d="M24 17 C20 20, 21 25, 25 26"/>
    <path d="M17 31 C22 30, 25 34, 22 39"/>
    <path d="M40 17 C44 20, 43 25, 39 26"/>
    <path d="M47 31 C42 30, 39 34, 42 39"/>
  </g>
</svg>
